[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weighslide"
version = "0.3.0"
description = "Flexible sliding window analysis"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Mark Teese" }]
keywords = ["sliding", "data", "normalisation", "normalization", "array"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Lower bounds only, deliberately. weighslide is a library that gets installed
# alongside a user's own stack, so exact pins here would make it uninstallable
# rather than reproducible. The bounds below are the oldest versions the test
# suite has actually been run against (see README), not guesses. CI pins nothing.
dependencies = [
    "pandas>=1.2",
    "numpy>=1.20",
    "matplotlib>=3.4",
    # pandas delegates .xlsx reading and writing to openpyxl, which it does not
    # install itself. run_weighslide always writes an .xlsx output file.
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
]

[project.scripts]
weighslide = "weighslide.weighslide:main"

[project.urls]
Homepage = "https://github.com/teese/weighslide"
Repository = "https://github.com/teese/weighslide"

[tool.setuptools.packages.find]
include = ["weighslide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Deprecations raised from weighslide's own code must fail the suite rather than
    # accumulate silently, as they did over the years this package went untouched.
    "error::FutureWarning:weighslide.*",
    "error::DeprecationWarning:weighslide.*",
]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["weighslide", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# weighslide/__init__.py re-exports the two public functions. The README documents
# `weighslide.run_weighslide(...)`, so dropping the re-export would break callers.
"weighslide/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["weighslide"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
allow_untyped_globals = true
